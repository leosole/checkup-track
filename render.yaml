# Render Blueprint: one free web service that runs the API and serves the built
# SPA from the same origin (SERVE_STATIC=1), so the frontend keeps using
# relative /api paths and needs no CORS or API base URL.
#
# Free-plan facts this setup accounts for:
#   - The disk is ephemeral, so PDFs must live in Backblaze B2 (B2_* below);
#     without them an exam's PDF disappears on the next deploy or spin-down.
#   - A free Render Postgres expires 30 days after creation, so DATABASE_URL
#     points at an external database (Neon free tier) instead.
#   - The service spins down after 15 minutes without traffic and takes about a
#     minute to wake, so the first request after idle is slow.
#
# Values marked `sync: false` are prompted for in the dashboard and never
# committed. JWT_SECRET is generated by Render.
services:
  - type: web
    name: checkup-track
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: "pip install -r api/requirements.txt && npm --prefix frontend ci && npm --prefix frontend run build"
    startCommand: "uvicorn api.index:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: SERVE_STATIC
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: CREDENTIAL_ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: B2_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: B2_BUCKET_NAME
        sync: false
